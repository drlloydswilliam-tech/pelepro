<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Find Your Home | PELEPRO</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #ff6b6b; --glass: rgba(255, 255, 255, 0.1); }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        
        body { 
            background: linear-gradient(rgba(0,0,0,0.8), rgba(0,0,0,0.8)), 
                        url('https://images.unsplash.com/photo-1512917774080-9991f1c4c750?auto=format&fit=crop&w=1920&q=80');
            background-size: cover;
            min-height: 100vh;
            display: flex; justify-content: center; align-items: center;
            color: white;
        }

        .search-container {
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(20px);
            padding: 50px;
            border-radius: 30px;
            border: 1px solid rgba(255,255,255,0.1);
            width: 90%;
            max-width: 600px;
            text-align: center;
            box-shadow: 0 25px 50px rgba(0,0,0,0.5);
        }

        h2 { font-size: 28px; margin-bottom: 30px; letter-spacing: -1px; }
        .search-box { display: flex; flex-direction: column; gap: 20px; }
        .input-wrap { text-align: left; }
        label { font-size: 11px; font-weight: 600; text-transform: uppercase; color: var(--primary); margin-bottom: 8px; display: block; }

        select {
            width: 100%; padding: 15px; border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.2);
            background: rgba(255,255,255,0.05);
            color: white; font-size: 15px; outline: none; transition: 0.3s;
            appearance: none;
            cursor: pointer;
        }

        select option { background: #1a1a1a; color: white; padding: 10px; }
        select:focus { border-color: var(--primary); background: rgba(255,255,255,0.1); }

        .btn-search {
            margin-top: 10px; padding: 18px; background: var(--primary);
            color: white; border: none; border-radius: 12px;
            font-weight: 700; cursor: pointer; font-size: 16px;
            transition: 0.3s; text-transform: uppercase;
        }

        .btn-search:hover { transform: translateY(-3px); box-shadow: 0 10px 20px rgba(255, 107, 107, 0.3); }
        .back-home { margin-top: 20px; display: block; color: rgba(255,255,255,0.5); text-decoration: none; font-size: 13px; }
    </style>
</head>
<body>

    <div class="search-container">
        <h2>Start Your Search</h2>
        
        <div class="search-box">
            <div class="input-wrap">
                <label>State</label>
                <select id="stateSelect" onchange="updateLGA()">
                    <option value="">Select State</option>
                </select>
            </div>

            <div class="input-wrap">
                <label>LGA / Neighborhood</label>
                <select id="lgaSelect">
                    <option value="">Select LGA</option>
                </select>
            </div>

            <div class="input-wrap">
                <label>Property Type</label>
                <select id="searchType">
                    <option value="sale">For Sale</option>
                    <option value="rent">For Rent</option>
                </select>
            </div>

            <button class="btn-search" onclick="executeSearch()">Find Properties</button>
        </div>

        <a href="index.html" class="back-home">Return to Home</a>
    </div>

        // Populate State Dropdown
        const stateSelect = document.getElementById('stateSelect');
        const lgaSelect = document.getElementById('lgaSelect');

        Object.keys(nigeriaData).forEach(state => {
            let opt = document.createElement('option');
            opt.value = state;
            opt.innerHTML = state;
            stateSelect.appendChild(opt);
        });

        // Check URL parameters and pre-select type if provided
        const urlParams = new URLSearchParams(window.location.search);
        const typeParam = urlParams.get('type');
        if (typeParam) {
            document.getElementById('searchType').value = typeParam;
        }

        // Update LGA Dropdown based on State
        function updateLGA() {
            const selectedState = stateSelect.value;
            lgaSelect.innerHTML = '<option value="">Select LGA</option>'; // Reset

            if (selectedState) {
                const lgas = nigeriaData[selectedState];
                lgas.forEach(lga => {
                    let opt = document.createElement('option');
                    opt.value = lga;
                    opt.innerHTML = lga;
                    lgaSelect.appendChild(opt);
                });
            }
        }

        function executeSearch() {
            const state = stateSelect.value;
            const lga = lgaSelect.value;
            const type = document.getElementById('searchType').value;

            if (!state || !lga) {
                alert("Please select both a State and an LGA.");
                return;
            }

            // Save search parameters - we use the LGA for the primary location search
            localStorage.setItem('lastSearchLoc', lga.toLowerCase());
            localStorage.setItem('lastSearchState', state.toLowerCase());
            
            // Redirect
            window.location.href = (type === 'sale') ? "sale.html" : "rent.html";
        }
