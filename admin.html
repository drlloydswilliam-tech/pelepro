<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PELEPRO | Master Admin</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #ff6b6b; --dark: #2d3436; --bg: #f4f7f6; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { background: var(--bg); color: var(--dark); padding: 40px 5%; }

        .dashboard-header { max-width: 1100px; margin: 0 auto 30px; display: flex; justify-content: space-between; align-items: center; }
        .back-link { text-decoration: none; color: var(--primary); font-weight: 600; font-size: 14px; }

        .dashboard-container {
            max-width: 1100px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 450px 1fr;
            gap: 30px;
        }

        .admin-card {
            background: white; padding: 30px; border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05); height: fit-content;
            position: sticky; top: 40px;
        }

        h2 { margin-bottom: 20px; font-size: 18px; }
        .form-group { margin-bottom: 20px; }
        label { display: block; font-size: 11px; font-weight: 700; text-transform: uppercase; margin-bottom: 8px; color: #b2bec3; }
        
        input[type="text"], select {
            width: 100%; padding: 12px; border-radius: 10px;
            border: 1px solid #dfe6e9; outline: none; font-size: 14px;
        }

        input[type="file"] {
            font-size: 12px; background: #f9f9f9; padding: 10px;
            border-radius: 10px; width: 100%; border: 1px dashed #ccc;
        }

        .checkbox-group { display: flex; align-items: center; gap: 10px; cursor: pointer; }
        .checkbox-group input { width: 18px; height: 18px; cursor: pointer; }

        .btn-post {
            width: 100%; padding: 16px; border-radius: 12px; border: none;
            background: var(--dark); color: white; font-weight: 700;
            cursor: pointer; transition: 0.3s; margin-top: 10px;
        }
        .btn-post:hover { background: var(--primary); transform: translateY(-2px); }

        .manage-card {
            background: white; padding: 30px; border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
        }
        table { width: 100%; border-collapse: collapse; }
        th { text-align: left; font-size: 11px; color: #a4b0be; padding-bottom: 15px; border-bottom: 1px solid #f1f2f6; text-transform: uppercase; }
        td { padding: 15px 0; border-bottom: 1px solid #f1f2f6; font-size: 13px; }
        
        .btn-action { border: none; background: none; font-weight: 600; cursor: pointer; margin-right: 10px; font-size: 12px; }
        .btn-edit { color: #0984e3; }
        .btn-delete { color: #ff7675; }

        .badge-featured { background: #ffeaa7; color: #d63031; padding: 2px 6px; border-radius: 4px; font-size: 10px; font-weight: 700; }

        #uploadStatus { font-size: 12px; color: var(--primary); margin-top: 10px; font-weight: 600; }
    </style>
</head>
<body>

    <!-- Login Form -->
    <div id="loginContainer" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 10000; justify-content: center; align-items: center;">
        <div style="background: white; padding: 40px; border-radius: 20px; text-align: center; max-width: 400px; width: 90%;">
            <h2 style="margin-bottom: 20px; color: #2d3436;">Admin Login</h2>
            <input type="password" id="adminPassword" placeholder="Enter Admin Password" style="width: 100%; padding: 12px; border-radius: 10px; border: 1px solid #dfe6e9; margin-bottom: 20px; font-size: 14px;" onkeypress="if(event.key === 'Enter') loginAdmin()">
            <button onclick="loginAdmin()" style="width: 100%; padding: 14px; background: #ff6b6b; color: white; border: none; border-radius: 10px; font-weight: 600; cursor: pointer;">Login</button>
            <p id="loginError" style="color: red; margin-top: 10px; display: none;">Incorrect password. Try again.</p>
        </div>
    </div>

    <div id="adminContent" style="display: none;">
        <div class="dashboard-header">
            <a href="index.html" class="back-link">← Return to Site</a>
            <h1 style="font-size: 24px;">Admin Dashboard</h1>
            <button onclick="logoutAdmin()" style="background: #b2bec3; color: white; border: none; padding: 8px 16px; border-radius: 8px; cursor: pointer;">Logout</button>
        </div>

    <div class="dashboard-container">
        <div class="admin-card">
            <h2 id="formTitle">Add New Property</h2>
            
            <input type="hidden" id="editId">

            <div class="form-group">
                <label>Property Name</label>
                <input type="text" id="pTitle" placeholder="e.g. Ocean View Apartment">
            </div>

            <div class="form-group">
                <label>State</label>
                <select id="pState" onchange="updateLGA()">
                    <option value="">Select State</option>
                </select>
            </div>

            <div class="form-group">
                <label>LGA / Neighborhood</label>
                <select id="pLGA">
                    <option value="">Select LGA</option>
                </select>
            </div>

            <div class="form-group">
                <label>Price</label>
                <input type="text" id="pPrice" placeholder="e.g. ₦150,000,000">
            </div>

            <div class="form-group">
                <label>Category</label>
                <select id="pType">
                    <option value="sale">For Sale</option>
                    <option value="rent">For Rent</option>
                </select>
            </div>

            <div class="form-group">
                <label>Description</label>
                <textarea id="pDescription" placeholder="Describe the property, features, amenities, etc." style="width: 100%; padding: 12px; border-radius: 10px; border: 1px solid #dfe6e9; font-size: 14px; font-family: 'Poppins', sans-serif; resize: vertical; min-height: 100px;"></textarea>
            </div>

            <div class="form-group checkbox-group">
                <input type="checkbox" id="pFeatured">
                <label style="margin-bottom:0">Featured (Show on Home Slider)</label>
            </div>

            <div class="form-group checkbox-group">
                <input type="checkbox" id="pVerified">
                <label style="margin-bottom:0">Verified Property</label>
            </div>

            <div class="form-group">
                <label>Upload Images</label>
                <input type="file" id="pImages" accept="image/*" multiple>
            </div>

            <div class="form-group">
                <label>Upload Videos (Optional)</label>
                <input type="file" id="pVideos" accept="video/*" multiple>
            </div>

            <button class="btn-post" id="publishBtn" onclick="processAndSave()">Publish Listing</button>
            <button class="btn-post" id="cancelBtn" onclick="resetForm()" style="display:none; background:#b2bec3; margin-top: 5px;">Cancel Edit</button>
            <p id="uploadStatus"></p>
        </div>

        <div class="manage-card">
            <h2>Live Listings</h2>
            <table>
                <thead>
                    <tr>
                                <th>Property</th>
                        <th>Location</th>
                        <th>Type</th>
                        <th>Price</th>
                        <th>Verified</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody id="listingTable"></tbody>
            </table>
        </div>
    </div>

        // Populate States on Load
        const stateSelect = document.getElementById('pState');
        const lgaSelect = document.getElementById('pLGA');

        Object.keys(nigeriaData).forEach(state => {
            let opt = document.createElement('option');
            opt.value = state;
            opt.innerHTML = state;
            stateSelect.appendChild(opt);
        });

        function updateLGA(selectedLga = "") {
            const selectedState = stateSelect.value;
            lgaSelect.innerHTML = '<option value="">Select LGA</option>';
            if (selectedState) {
                nigeriaData[selectedState].forEach(lga => {
                    let opt = document.createElement('option');
                    opt.value = lga;
                    opt.innerHTML = lga;
                    if(lga === selectedLga) opt.selected = true;
                    lgaSelect.appendChild(opt);
                });
            }
        }

        // Auth Check
        if (localStorage.getItem('isAdmin') === 'true') {
            document.getElementById('adminContent').style.display = 'block';
        } else {
            document.getElementById('loginContainer').style.display = 'flex';
        }

        function loginAdmin() {
            const password = document.getElementById('adminPassword').value;
            if (password === 'admin123') {  // Simple hardcoded password for demo
                localStorage.setItem('isAdmin', 'true');
                document.getElementById('loginContainer').style.display = 'none';
                document.getElementById('adminContent').style.display = 'block';
                loadListings();  // Load the listings after login
            } else {
                document.getElementById('loginError').style.display = 'block';
            }
        }

        function logoutAdmin() {
            localStorage.removeItem('isAdmin');
            window.location.href = 'index.html';
        }

        const fileToDataUrl = file => new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.onload = () => resolve(reader.result);
            reader.onerror = reject;
            reader.readAsDataURL(file);
        });

        async function processAndSave() {
            const editId = document.getElementById('editId').value;
            const title = document.getElementById('pTitle').value;
            const state = document.getElementById('pState').value;
            const lga = document.getElementById('pLGA').value;
            const price = document.getElementById('pPrice').value;
            const type = document.getElementById('pType').value;
            const description = document.getElementById('pDescription').value;
            const isFeatured = document.getElementById('pFeatured').checked;
            const imageFiles = document.getElementById('pImages').files;
            const videoFiles = document.getElementById('pVideos').files;
            const status = document.getElementById('uploadStatus');

            if(!title || !state || !lga) return alert("Title, State, and LGA are required.");

            status.innerText = "Processing Listing...";
            document.getElementById('publishBtn').disabled = true;

            try {
                let db = JSON.parse(localStorage.getItem('property_db')) || [];
                let imageUrls = [];
                let videoUrls = [];

                if (editId) {
                    const oldItem = db.find(p => p.id == editId);
                    imageUrls = imageFiles.length > 0 ? await Promise.all(Array.from(imageFiles).map(file => fileToDataUrl(file))) : oldItem.images;
                    videoUrls = videoFiles.length > 0 ? await Promise.all(Array.from(videoFiles).map(file => fileToDataUrl(file))) : oldItem.videos;
                } else {
                    if (imageFiles.length === 0) throw new Error("At least one image is required.");
                    imageUrls = await Promise.all(Array.from(imageFiles).map(file => fileToDataUrl(file)));
                    videoUrls = await Promise.all(Array.from(videoFiles).map(file => fileToDataUrl(file)));
                }

                const isVerified = document.getElementById('pVerified').checked;
                const propertyData = {
                    id: editId ? parseInt(editId) : Date.now(),
                    title,
                    state,
                    location: lga, // We store the LGA in the 'location' field for search compatibility
                    price,
                    type,
                    description,
                    featured: isFeatured,
                    verified: isVerified,
                    images: imageUrls,
                    videos: videoUrls,
                    image: imageUrls[0]
                };

                if (editId) {
                    const index = db.findIndex(p => p.id == editId);
                    db[index] = propertyData;
                } else {
                    db.unshift(propertyData);
                }

                localStorage.setItem('property_db', JSON.stringify(db));
                resetForm();
                loadListings();
                alert("Success!");

            } catch (err) {
                alert(err.message);
            } finally {
                document.getElementById('publishBtn').disabled = false;
                status.innerText = "";
            }
        }

        function loadListings() {
            const table = document.getElementById('listingTable');
            const db = JSON.parse(localStorage.getItem('property_db')) || [];
            table.innerHTML = db.map(p => `
                <tr>
                    <td><strong>${p.title}</strong> ${p.featured ? '<span class="badge-featured">F</span>' : ''}</td>
                    <td>${p.location}, ${p.state}</td>
                    <td>${p.type.toUpperCase()}</td>
                    <td>${p.price}</td>
                    <td>${p.verified ? 'Yes' : 'No'}</td>
                    <td>
                        <button class="btn-action btn-edit" onclick="editItem(${p.id})">Edit</button>
                        <button class="btn-action btn-action-verify" onclick="toggleVerified(${p.id})">${p.verified ? 'Unverify' : 'Verify'}</button>
                        <button class="btn-action btn-delete" onclick="deleteItem(${p.id})">Delete</button>
                    </td>
                </tr>
            `).join('');
        }

        function editItem(id) {
            const db = JSON.parse(localStorage.getItem('property_db')) || [];
            const p = db.find(item => item.id == id);
            if(!p) return;

            document.getElementById('editId').value = p.id;
            document.getElementById('pTitle').value = p.title;
            document.getElementById('pState').value = p.state;
            updateLGA(p.location); // Trigger LGA population and select current one
            document.getElementById('pPrice').value = p.price;
            document.getElementById('pType').value = p.type;
            document.getElementById('pDescription').value = p.description || "";
            document.getElementById('pFeatured').checked = p.featured || false;
            document.getElementById('pVerified').checked = p.verified || false;

            document.getElementById('formTitle').innerText = "Update Property";
            document.getElementById('publishBtn').innerText = "Save Changes";
            document.getElementById('cancelBtn').style.display = "block";
            window.scrollTo(0,0);
        }

        function resetForm() {
            document.getElementById('editId').value = "";
            document.getElementById('pTitle').value = "";
            document.getElementById('pState').value = "";
            lgaSelect.innerHTML = '<option value="">Select LGA</option>';
            document.getElementById('pPrice').value = "";
            document.getElementById('pDescription').value = "";
            document.getElementById('pFeatured').checked = false;
            document.getElementById('pVerified').checked = false;
            document.getElementById('pImages').value = "";
            document.getElementById('pVideos').value = "";
            document.getElementById('formTitle').innerText = "Add New Property";
            document.getElementById('publishBtn').innerText = "Publish Listing";
            document.getElementById('cancelBtn').style.display = "none";
        }

        function toggleVerified(id) {
            let db = JSON.parse(localStorage.getItem('property_db')) || [];
            const idx = db.findIndex(p => p.id == id);
            if (idx === -1) return;
            db[idx].verified = !db[idx].verified;
            localStorage.setItem('property_db', JSON.stringify(db));
            loadListings();
        }

        function deleteItem(id) {
            if(confirm("Delete this listing?")) {
                let db = JSON.parse(localStorage.getItem('property_db')) || [];
                db = db.filter(p => p.id !== id);
                localStorage.setItem('property_db', JSON.stringify(db));
                loadListings();
            }
        }

        window.onload = loadListings;
    </script>
    </div> <!-- End adminContent -->
</body>
</html>
